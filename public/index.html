<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOME ID — Tableau de bord</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- BARRE DU HAUT -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">⌂</div>
      <div>HOME <strong>ID</strong></div>
    </div>
    <div class="user">
      <span class="user-icon">👤</span>
      <span id="user-role-label">Propriétaire</span>
    </div>
  </header>

  <main class="container">
    <!-- INTRODUCTION -->
    <section class="welcome">
      <div>
        <div class="eyebrow">IDENTITÉ NUMÉRIQUE</div>
        <h1 id="display-house-name">...</h1>
        <p>Toute la mémoire technique de votre maison, au même endroit.</p>
      </div>
      <button class="button primary" onclick="openAddMenu()">
        + Ajouter
      </button>
    </section>

    <!-- CARTE MAISON -->
    <section class="house-card">
      <div class="house-info">
        <div class="house-image">🏠</div>
        <div>
          <div class="eyebrow">MA MAISON</div>
          <h2 id="display-house-id">...</h2>
          <p>Votre maison, son histoire et tous ses systèmes.</p>
        </div>
      </div>
      <div class="house-details">
        <div>
          <span>Construction</span>
          <strong id="display-house-year">-</strong>
        </div>
        <div>
          <span>Surface</span>
          <strong id="display-house-surface">-</strong>
        </div>
        <div>
          <span>Terrain</span>
          <strong id="display-house-land">-</strong>
        </div>
      </div>
      <button class="button secondary" onclick="openPlan()">
        🗺️ Voir le plan
      </button>
    </section>

    <!-- GRILLE PRINCIPALE -->
    <div class="dashboard-grid">
      <!-- SYSTÈMES -->
      <section class="card systems-card">
        <div class="card-header">
          <div>
            <div class="eyebrow">INSTALLATIONS</div>
            <h2>Mes systèmes</h2>
          </div>
          <button class="link-button" onclick="openAddEquipmentModal()">
            + Équipement
          </button>
        </div>
        <div id="systems" class="systems">
          <!-- Chargé par JavaScript -->
        </div>
      </section>

      <!-- PROFESSIONNELS -->
      <section class="card">
        <div class="card-header">
          <div>
            <div class="eyebrow">ACCÈS</div>
            <h2>Professionnels</h2>
          </div>
          <button class="link-button" onclick="openQrSimulatorModal()">
            Simuler QR Pro
          </button>
        </div>
        <div id="professionals">
          <!-- Chargé par JavaScript -->
        </div>
      </section>
    </div>
  </main>

  <!-- FENÊTRE MODALE -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <button class="close" onclick="closeModal()">×</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- MESSAGE TEMPORAIRE -->
  <div id="toast" class="toast"></div>

  <script src="/app.js"></script>
</body>
</html>
