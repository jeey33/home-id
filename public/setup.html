<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOME ID — Configuration</title>
  <style>
    body { background: #f4f6f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .setup-card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); max-width: 400px; width: 90%; }
    .brand { display: flex; align-items: center; gap: 8px; font-size: 20px; color: #1e362d; margin-bottom: 20px; justify-content: center; }
    .brand-icon { background: #e3e8e4; width: 32px; height: 32px; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 18px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: #59645d; margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cdd4ce; box-sizing: border-box; font-size: 14px; }
    .button.primary { background: #1e362d; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 15px; font-size: 15px; transition: 0.2s; }
    .button.primary:hover { background: #2c4a3e; }
  </style>
</head>
<body>

  <div class="setup-card">
    <div class="brand">
      <div class="brand-icon">⌂</div>
      <div>HOME <strong>ID</strong></div>
    </div>
    <h2 style="margin: 0 0 5px 0; text-align: center;">Bienvenue chez vous</h2>
    <p style="color: #77827a; font-size: 14px; text-align: center; margin-bottom: 25px;">Commençons par configurer la mémoire numérique de votre maison.</p>
    
    <form id="setup-form" onsubmit="submitSetup(event)">
      <div class="form-group">
        <label>Nom de la maison *</label>
        <input type="text" id="setup-name" required placeholder="Ex: Villa des Lilas">
      </div>
      
      <div class="form-group">
        <label>Année de construction *</label>
        <input type="number" id="setup-year" required placeholder="Ex: 2015">
      </div>
      
      <div style="display:flex; gap:10px;">
        <div class="form-group" style="flex:1;">
          <label>Surface (m²)</label>
          <input type="number" id="setup-surface" placeholder="120">
        </div>
        <div class="form-group" style="flex:1;">
          <label>Terrain (m²)</label>
          <input type="number" id="setup-land" placeholder="400">
        </div>
      </div>
      
      <div class="form-group" style="margin-top: 10px;">
        <label>Mot de passe propriétaire *</label>
        <input type="password" id="setup-password" required placeholder="Créez un mot de passe sécurisé">
      </div>
      
      <button type="submit" class="button primary">Créer ma maison</button>
    </form>
    
    <div id="setup-error" style="color: #d93025; font-size: 13px; margin-top: 15px; text-align: center; display: none; font-weight:bold;"></div>
  </div>

  <script>
    async function submitSetup(event) {
      event.preventDefault();
      
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get("id") || "HID-" + Math.random().toString(36).substring(2, 8).toUpperCase();

      const payload = {
        id: id,
        name: document.getElementById("setup-name").value,
        year: document.getElementById("setup-year").value,
        surface: document.getElementById("setup-surface").value,
        land: document.getElementById("setup-land").value,
        password: document.getElementById("setup-password").value
      };

      try {
        const response = await fetch("/api/setup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        
        const result = await response.json();

        if (response.ok) {
          // LIGNE CORRIGÉE : On garde en mémoire que l'utilisateur est bien le propriétaire
          sessionStorage.setItem("homeid_session", result.id);
          
          // Redirection vers le tableau de bord
          window.location.href = `/?id=${result.id}`;
        } else {
          showError(result.error || "Erreur lors de la création.");
        }
      } catch (err) {
        showError("Erreur de connexion au serveur.");
      }
    }

    function showError(message) {
      const errDiv = document.getElementById("setup-error");
      errDiv.textContent = message;
      errDiv.style.display = "block";
    }
  </script>
</body>
</html>
